name: financial QA
run-name: ${{ github.event_name == 'workflow_dispatch' && format('certification-{0}-{1}-{2}', inputs.release_certification, inputs.antitrust_release_sha, inputs.extended) || github.event_name }}
on:
  push:
  pull_request:
  schedule:
    - cron: '47 3 * * 0'
  workflow_dispatch:
    inputs:
      release_certification:
        description: 'Require an explicit full antitrust candidate SHA'
        required: false
        default: false
        type: boolean
      antitrust_ref:
        description: 'Antitrust development bootstrap ref (ignored for certification)'
        required: false
        default: 'master'
        type: string
      antitrust_release_sha:
        description: 'Full 40-character antitrust candidate SHA'
        required: false
        type: string
      extended:
        description: 'Run extended economic validation'
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RELEASE_CERTIFICATION: ${{ inputs.release_certification && 'true' || 'false' }}
      ANTITRUST_REF: ${{ inputs.antitrust_ref || 'master' }}
      ANTITRUST_RELEASE_SHA: ${{ inputs.release_certification && inputs.antitrust_release_sha || '' }}
      FINANCIAL_EXTENDED_TESTS: ${{ (github.event_name == 'schedule' || inputs.extended) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select antitrust dependency ref
        id: antitrust-ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CERTIFICATION" == true ]]; then
            if [[ ! "$ANTITRUST_RELEASE_SHA" =~ ^[[:xdigit:]]{40}$ ]]; then
              echo "Release certification requires antitrust_release_sha as an explicit full 40-character SHA; mutable refs such as main/refactor are rejected." >&2
              exit 1
            fi
            selected_ref="$ANTITRUST_RELEASE_SHA"
          elif [[ ( "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/release/* ) || ( "$GITHUB_EVENT_NAME" == pull_request && ( "${GITHUB_HEAD_REF:-}" == release/* || "${GITHUB_BASE_REF:-}" == release/* ) ) ]]; then
            selected_ref="$(python3 - ci/release-dependencies.json <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              dependencies = json.load(handle)
          if set(dependencies) != {"antitrust"}:
              raise SystemExit("ci/release-dependencies.json must define exactly antitrust")
          sha = dependencies["antitrust"]
          if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-fA-F]{40}", sha):
              raise SystemExit("The release antitrust dependency must be a full 40-character SHA")
          print(sha)
          PY
          )"
          else
            selected_ref="$ANTITRUST_REF"
          fi
          echo "antitrust_ref=$selected_ref" >> "$GITHUB_OUTPUT"
          echo "ANTITRUST_REF=$selected_ref" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: luciu5/antitrust
          ref: ${{ steps.antitrust-ref.outputs.antitrust_ref }}
          path: dependency-antitrust

      - name: Move dependency checkout outside the package source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/financial-dependencies"
          mv dependency-antitrust "$RUNNER_TEMP/financial-dependencies/antitrust"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Explicit packages below own third-party provisioning. Disable the
          # action's separate DESCRIPTION scan for Pandoc/internal dependencies.
          install-pandoc: false
          dependencies: '"hard"'
          packages: any::testthat, any::BB, any::nleqslv, any::cubature, any::numDeriv, any::dplyr, any::posterior, any::SQUAREM, any::knitr, any::bookdown, any::rmarkdown
      - name: Check exact dependency stack
        env:
          FINANCIAL_OUTPUT_DIR: ${{ runner.temp }}/financial-check
        run: bash ci/build-check.sh "$RUNNER_TEMP/financial-dependencies/antitrust"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-release-evidence
          path: ${{ runner.temp }}/financial-check
